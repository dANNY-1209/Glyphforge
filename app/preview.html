<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Glyphforge — arcane/glyph-tech preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --gf-bg:#0b0a10;--gf-surface:#131019;--gf-surface-2:#1b1726;--gf-line:#2a2438;
  --gf-hairline:rgba(179,157,255,.10);
  --gf-ember:#ff6a3d;--gf-ember-press:#e2542b;--gf-ember-glow:rgba(255,106,61,.30);
  --gf-rune:#b39dff;--gf-text:#ece8f5;--gf-text-dim:#9a93ad;--gf-text-faint:#5f596f;
  --gf-r18:#e86aa0;--gf-ok:#5fcf8e;
  --font-sans:"Geist",system-ui,"Noto Sans TC",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,monospace;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--font-sans);color:var(--gf-text);
  background:
    radial-gradient(var(--gf-hairline) 1px,transparent 1px) 0 0/22px 22px,
    radial-gradient(900px 420px at 88% -8%,rgba(255,106,61,.07),transparent 60%),
    var(--gf-bg);
  min-height:100vh}
.mono{font-family:var(--font-mono)}
.wrap{max-width:1080px;margin:0 auto;padding:26px 28px 60px}

/* top bar */
.top{display:flex;align-items:center;gap:22px;padding:14px 18px;border:1px solid var(--gf-line);
  border-radius:14px;background:rgba(19,16,25,.7);backdrop-filter:none}
.brand{font-family:var(--font-mono);font-weight:600;letter-spacing:.14em;font-size:14px}
.brand b{color:var(--gf-ember)}
.tabs{display:flex;gap:4px;margin-left:6px}
.tab{font-family:var(--font-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--gf-text-dim);padding:7px 12px;border-radius:8px;text-decoration:none}
.tab:hover{color:var(--gf-text)}
.tab.active{color:var(--gf-ember);box-shadow:inset 0 -2px 0 var(--gf-ember)}
.spacer{flex:1}
.metric{font-family:var(--font-mono);font-variant-numeric:tabular-nums;color:var(--gf-text-dim);font-size:12px}
.metric b{color:var(--gf-text)}

/* buttons */
.btn{font:inherit;font-size:13px;border-radius:10px;padding:9px 16px;cursor:pointer;border:1px solid transparent;transition:.14s cubic-bezier(.2,.7,.3,1)}
.btn-primary{background:var(--gf-ember);color:#1a0d08;font-weight:600}
.btn-primary:hover{filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:var(--gf-line);color:var(--gf-text-dim)}
.btn-ghost:hover{border-color:var(--gf-ember);color:var(--gf-text);box-shadow:inset 0 0 0 1px var(--gf-ember-glow)}

/* section label */
.sec{display:flex;align-items:center;gap:10px;margin:34px 2px 16px;
  font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.10em;font-size:12px;color:var(--gf-text-dim)}
.sec::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--gf-ember)}

/* cards */
.cards{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.card{border:1px solid var(--gf-line);border-radius:14px;background:var(--gf-surface);
  box-shadow:0 1px 2px rgba(0,0,0,.45);overflow:hidden;transition:.14s}
.card:hover{border-color:rgba(255,106,61,.5)}
.thumb{aspect-ratio:1/1;position:relative;
  background:
    radial-gradient(var(--gf-hairline) 1px,transparent 1px) 0 0/16px 16px,
    linear-gradient(160deg,#221a30,#16121e)}
.glyph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-mono);font-size:54px;color:rgba(179,157,255,.16)}
.live{position:absolute;top:10px;left:10px;width:7px;height:7px;border-radius:50%;
  background:var(--gf-ember);box-shadow:0 0 0 4px var(--gf-ember-glow)}
.r18{position:absolute;top:9px;right:9px;font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;
  color:var(--gf-r18);border:1px solid rgba(232,106,160,.4);border-radius:999px;padding:2px 8px;background:rgba(232,106,160,.08)}
.meta{padding:13px 14px}
.nm{font-weight:600;font-size:15px;letter-spacing:-.01em}
.id{font-family:var(--font-mono);font-size:11px;color:var(--gf-text-faint);margin-top:3px}
.tags{display:flex;gap:6px;margin-top:11px;flex-wrap:wrap}
.tag{font-family:var(--font-mono);font-size:11px;color:var(--gf-text-dim);
  border:1px solid var(--gf-line);border-radius:999px;padding:2px 9px}
.tag.arch{color:var(--gf-rune);border-color:rgba(179,157,255,.3)}

/* input row */
.row{display:flex;gap:10px;align-items:center;margin-top:26px}
.input{flex:1;max-width:340px;font:inherit;font-size:13px;background:var(--gf-surface-2);
  border:1px solid var(--gf-line);border-radius:10px;color:var(--gf-text);padding:10px 13px}
.input.focus{outline:none;border-color:var(--gf-ember);box-shadow:0 0 0 1px var(--gf-ember),0 0 0 4px var(--gf-ember-glow)}

/* swatches */
.sw{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.chip{display:flex;flex-direction:column;gap:6px;font-family:var(--font-mono);font-size:10px;color:var(--gf-text-faint)}
.dot{width:64px;height:40px;border-radius:8px;border:1px solid var(--gf-line)}
</style></head>
<body><div class="wrap">

  <div class="top">
    <span class="brand">◆ GLYPH<b>FORGE</b></span>
    <nav class="tabs">
      <a class="tab active">LoRA</a><a class="tab">Prompt</a><a class="tab">Costume</a>
      <a class="tab">Gallery</a><a class="tab">Stats</a>
    </nav>
    <span class="spacer"></span>
    <span class="metric"><b>342</b> glyphs · <b>27</b> forged today</span>
    <button class="btn btn-primary">＋ Forge</button>
  </div>

  <div class="sec">Character · LoRA</div>
  <div class="cards">
    <div class="card">
      <div class="thumb"><span class="live"></span><span class="glyph">ᚷ</span></div>
      <div class="meta"><div class="nm">Mizuki</div><div class="id mono">gf://char/mizuki-1.0</div>
        <div class="tags"><span class="tag arch">illustrious</span><span class="tag">anima</span><span class="tag">512×</span></div></div>
    </div>
    <div class="card">
      <div class="thumb"><span class="r18">R18</span><span class="glyph">ᛟ</span></div>
      <div class="meta"><div class="nm">Aria — twin tails</div><div class="id mono">gf://char/aria-2.3</div>
        <div class="tags"><span class="tag arch">illustrious</span><span class="tag">v2.3</span></div></div>
    </div>
    <div class="card">
      <div class="thumb"><span class="glyph">ᚱ</span></div>
      <div class="meta"><div class="nm">Noir</div><div class="id mono">gf://char/noir-0.9</div>
        <div class="tags"><span class="tag arch">anima</span><span class="tag">wip</span></div></div>
    </div>
  </div>

  <div class="sec">Components</div>
  <div class="row">
    <input class="input focus" value="search glyphs…">
    <button class="btn btn-ghost">Filter</button>
    <button class="btn btn-primary">Apply</button>
  </div>

  <div class="sec">Palette</div>
  <div class="sw">
    <div class="chip"><div class="dot" style="background:#0b0a10"></div>bg</div>
    <div class="chip"><div class="dot" style="background:#131019"></div>surface</div>
    <div class="chip"><div class="dot" style="background:#1b1726"></div>surface-2</div>
    <div class="chip"><div class="dot" style="background:#ff6a3d"></div>ember</div>
    <div class="chip"><div class="dot" style="background:#b39dff"></div>rune</div>
    <div class="chip"><div class="dot" style="background:#e86aa0"></div>r18</div>
    <div class="chip"><div class="dot" style="background:#ece8f5"></div>text</div>
  </div>

</div></body></html>
